[project]
name = "language-coach"
version = "0.1.0"
description = "Local-first conversational language coach backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.68.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.16.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live_provider: opt-in checks that call paid provider APIs",
]
