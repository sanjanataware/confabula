[project]
name = "language-coach"
version = "0.1.0"
description = "Local-first conversational language coach backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.141.1",
    "kokoro>=0.9.4,<1",
    "misaki[ja,zh]>=0.9.4,<1",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pydantic-settings>=2.15.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "elevenlabs>=2.68.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live_provider: opt-in checks that call paid provider APIs",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
